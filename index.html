<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <div class="logo-strip">
          <div class="logo">
            <img src="boat.png" alt="logo" />
          </div>
          <div class="logo-text">BLUE</div>
        </div>
        <div class="credits">
          Photo by
          <a href="https://unsplash.com/@alicetricky">Alice Triquet </a>on
          <a href="https://unsplash.com/photos/lake-and-trees-HeEJU3nrg_0">
            Unsplash</a
          >
        </div>
      </div>
      <div class="right">
        <div class="header">
            <div class="greetings">
          Enter a sanctuary in the heart of nature and experience serene lakes,
          forests, meadows, and rivers. 
          <p>Sign up now to get started.</p>
          </div>
          <p>You know you want to.</p>
        </div>
        <div class="form-strip">
          <h2>Let's do this!</h2>
          <form action="" method="post">
            <div class="form-upper">
              <div class="details form-row">
                <div class="field">
                  <label for="first-name">FIRST NAME</label>
                  <input type="text" id="first-name" name="first-name" required/>
                </div>
                <div class="field">
                  <label for="last-name">LAST NAME</label>
                  <input type="text" id="last-name" name="last-name" required/>
                </div>
              </div>

              <div class="contact form-row">
                <div class="field">
                  <label for="email">EMAIL</label>
                  <input type="email" id="email" name="email" required/>
                  </div>
                  <div class="field">
                  <label for="phone">PHONE NUMBER</label>
                  <input type="tel"  minlength="8" required>
                  </div>
                </div>
              </div>

              <div class="password form-row">
                <div class="field">
                  <label for="password">PASSWORD</label>
                  <input type="password" id="password" name="password" minlength="8" required/>
                  </div>
                  <div class="field">
                  <label for="confirm-pwd">CONFIRM PASSWORD</label>
                  <input type="password" id="confirm-pwd" name="confirm-pwd" minlength="8" required/>
                  </div>
                </div>
              </div>
            <div class="form-lower">
              <button id="signup">Create Account</button>
              <p id="already">
                Already have an account? <a href="#">Log in</a>
              </p>
            </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
